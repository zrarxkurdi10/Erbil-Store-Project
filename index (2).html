/* ==========================================================================
   Helpers

const round2 = (n) => Math.round(n * 100) / 100;

function formatMoney(usd, cur) {
  if (cur === "IQD") return Math.round(usd * CONFIG.iqdPerUsd).toLocaleString("en-US") + " IQD";
  const hasCents = Math.round(usd * 100) % 100 !== 0;
  return "$" + usd.toLocaleString("en-US", { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
}

function calcPlan(price, downPct, months) {
  const down = round2((price * downPct) / 100);
  const financed = round2(price - down);
  const fee = CONFIG.installmentFee[months] || 0;
  const feeAmount = round2(financed * fee);
  const monthly = round2((financed + feeAmount) / months);
  const total = round2(down + monthly * months);
  return { down, financed, feeAmount, monthly, total };
}

      .map((c) => ({ id: c.id, qty: Math.min(99, Math.floor(c.qty)) }));
  } catch (e) {
    return [];
  }
}

const useCurrency = () => useContext(CurrencyCtx);

function CurrencyProvider({ children }) {
  const [cur, setCurState] = useState(() => {
    try { return localStorage.getItem("zrar_cur") === "IQD" ? "IQD" : "USD"; } catch (e) { return "USD"; }
  });
  const setCur = useCallback((c) => {
    setCurState(c);
    try { localStorage.setItem("zrar_cur", c); } catch (e) {}
  }, []);
  const fmt = useCallback((usd) => formatMoney(usd, cur), [cur]);
  const value = useMemo(() => ({ cur, setCur, fmt }), [cur, setCur, fmt]);
  return <CurrencyCtx.Provider value={value}>{children}</CurrencyCtx.Provider>;
}

function Price({ usd, className = "" }) {
  const { cur, fmt } = useCurrency();
  return <span key={cur} className={"price-swap " + className}>{fmt(usd)}</span>;
}

        "--delay": "-" + delay + "s",
        "--from": colorFrom,
        "--to": colorTo,
        "--radius": radius + "px",
      }}
    >
      <span className="beam-dot" style={{ animationDirection: reverse ? "reverse" : "normal" }} />
    </span>
  );
}

/* ==========================================================================
   Scroll animation primitives (GSAP + ScrollTrigger)
   ========================================================================== */
function Reveal({ children, className = "", y = 60, scale = 0.96, delay = 0 }) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (prefersReduced) { gsap.set(el, { opacity: 1 }); return; }
    const ctx = gsap.context(() => {
      gsap.fromTo(
        el,
        { opacity: 0, y, scale },
        {
          opacity: 1, y: 0, scale: 1, duration: 1.15, delay, ease: "power3.out",
          scrollTrigger: { trigger: el, start: "top 90%", once: true },
        }
      );
    });
    return () => ctx.revert();
  }, []);
  return <div ref={ref} className={className} style={{ opacity: 0 }}>{children}</div>;
}

function Words({ text, className = "" }) {

        const accent = w.startsWith("_");
        const label = accent ? w.replace(/_/g, "") : w;

            <span className="inline-block overflow-hidden align-bottom pb-[0.14em] -mb-[0.14em]">
              <span className={"hw inline-block will-change-transform " + (accent ? "italic text-gold-grad" : "")}>{label}</span>
            </span>{" "}
          </React.Fragment>

      })}
    </span>
  );
}

function ScrollWords({ text, className = "" }) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    const ctx = gsap.context(() => {
      const words = ref.current.querySelectorAll(".sw");
      if (prefersReduced) { gsap.set(words, { opacity: 1 }); return; }
      gsap.fromTo(
        words,
        { opacity: 0.14 },
        {
          opacity: 1, ease: "none", stagger: 0.12,
          scrollTrigger: { trigger: ref.current, start: "top 82%", end: "bottom 50%", scrub: true },
        }
      );
    }, ref);
    return () => ctx.revert();
  }, []);
  return (
    <p ref={ref} className={className}>
      {text.split(" ").map((w, i) => (
        <span key={i} className="sw inline-block mr-[0.28em]" style={{ opacity: 0.14 }}>{w}</span>
      ))}
    </p>
  );
}

function CountUp({ value, prefix = "", suffix = "" }) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    const el = ref.current;
    const obj = { v: prefersReduced ? value : 0 };
    const render = () => { el.textContent = prefix + Math.round(obj.v).toLocaleString("en-US") + suffix; };
    render();
    if (prefersReduced) return;
    const ctx = gsap.context(() => {
      gsap.to(obj, {
        v: value, duration: 2.2, ease: "power2.out", onUpdate: render,
        scrollTrigger: { trigger: el, start: "top 88%", once: true },
      });
    });
    return () => ctx.revert();
  }, [value]);
  return <span ref={ref} />;
}

/* ==========================================================================
   Product card (3D tilt + zoom + optional border beams)
   ========================================================================== */
function ProductCard({ p, index, onAdd, onPlan }) {
  const tilt = useRef(null);
  const [added, setAdded] = useState(false);
  const eligible = p.price >= CONFIG.installmentMinPrice;
  const lowest = eligible ? calcPlan(p.price, 0, CONFIG.installmentMonths[CONFIG.installmentMonths.length - 1]).monthly : 0;

  useEffect(() => {
    if (!added) return;
    const t = setTimeout(() => setAdded(false), 1500);
    return () => clearTimeout(t);
  }, [added]);

  const move = (e) => {
    if (e.pointerType === "touch" || prefersReduced) return;
    const el = tilt.current;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    gsap.to(el, {
      rotateY: (px - 0.5) * 14, rotateX: -(py - 0.5) * 14, scale: 1.025,
      transformPerspective: 900, transformOrigin: "center", duration: 0.5, ease: "power2.out", overwrite: "auto",
    });
    el.style.setProperty("--mx", px * 100 + "%");
    el.style.setProperty("--my", py * 100 + "%");
  };
  const leave = () => {
    gsap.to(tilt.current, { rotateY: 0, rotateX: 0, scale: 1, duration: 0.9, ease: "power3.out", overwrite: "auto" });
  };

  return (
    <Reveal delay={(index % 3) * 0.1} y={70} scale={0.95} className="h-full">
      <article
        ref={tilt}
        onPointerMove={move}
        onPointerLeave={leave}
        className="tilt-card glass group relative flex h-full flex-col overflow-hidden rounded-[28px]"
      >
        <div className="spot" />
        <div className="relative">
          {/* <!-- REPLACE WITH YOUR PRODUCT IMAGE --> (edit the `img:` field for this product in the PRODUCTS list at the top of the script) */}
          <ProductImage p={p} className="aspect-square" imgClass="transition-transform duration-[900ms] ease-out group-hover:scale-110" />
          <div className="pointer-events-none absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-transparent to-black/20" />
          <span className="absolute left-4 top-4 rounded-full border border-gold/40 bg-black/50 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.18em] text-gold-light backdrop-blur-md">{p.badge}</span>
          <span className="absolute right-4 top-4 rounded-full border border-white/15 bg-black/40 px-3 py-1 text-[10px] uppercase tracking-[0.18em] text-white/70 backdrop-blur-md">{p.category}</span>
        </div>

        <div className="relative z-[2] flex flex-1 flex-col p-6 pt-2">
          <h3 className="font-display text-[1.7rem] font-medium leading-tight">{p.name}</h3>
          <p className="mt-1.5 text-sm text-white/55">{p.tagline}</p>
          <ul className="mt-4 flex flex-wrap gap-2">
            {p.specs.map((s) => (
              <li key={s} className="rounded-full border border-white/10 bg-white/[0.04] px-3 py-1 text-[11px] text-white/65">{s}</li>
            ))}
          </ul>

          <div className="mt-auto pt-6">
            <div className="flex items-end justify-between gap-3">
              <div>
                <Price usd={p.price} className="font-display text-3xl font-semibold" />
                {eligible && (
                  <div className="mt-1 text-xs text-gold-light/90">
                    or from <Price usd={lowest} /> /mo
                  </div>
                )}
              </div>
              {eligible && (
                <button
                  onClick={() => onPlan(p)}
                  className="flex items-center gap-1.5 rounded-full border border-white/15 bg-white/[0.04] px-3.5 py-2 text-[11px] font-semibold text-white/80 transition hover:border-gold/60 hover:text-white"
                >
                  <Icon name="calc" size={14} /> Installments
                </button>
              )}
            </div>
            <button
              onClick={() => { onAdd(p); setAdded(true); }}
              className={"btn mt-5 w-full " + (added ? "btn-ghost !border-gold/60" : "btn-gold")}
            >
              {added ? (<><Icon name="check" size={17} /> Added to bag</>) : (<><Icon name="bag" size={17} /> Add to bag</>)}
            </button>
          </div>
        </div>

        {p.featured && (
          <>
            <BorderBeam size={240} duration={9} borderWidth={1.5} radius={28} colorFrom="#f3dba5" colorTo="#d9b36b" />
            <BorderBeam size={240} duration={9} delay={4.5} borderWidth={2} radius={28} colorFrom="#8b7bff" colorTo="#4cc9ff" />
          </>
        )}
      </article>
    </Reveal>
  );
}

          <div className="grid gap-6 lg:grid-cols-[1.05fr_0.95fr]">

            <div className="glass rounded-[28px] p-6 sm:p-8">
              <p className="eyebrow">1 · Choose your device</p>
              <div className="mt-5 grid gap-3">
                {eligible.map((d) => (
                  <button
                    key={d.id}
                    onClick={() => setSelectedId(d.id)}
                    aria-pressed={d.id === p.id}
                    className={"flex items-center gap-4 rounded-2xl border p-3 text-left transition " + (d.id === p.id ? "border-gold/60 bg-gold/10" : "border-white/10 bg-white/[0.03] hover:border-white/25")}
                  >
                    <ProductImage p={d} className="h-14 w-14 shrink-0 rounded-xl" />
                    <span className="min-w-0 flex-1">
                      <span className="block truncate font-display text-xl leading-tight">{d.name}</span>
                      <span className="text-xs text-white/50">{d.category}</span>
                    </span>
                    <Price usd={d.price} className="text-sm font-semibold text-white/90" />
                  </button>
                ))}
              </div>

              <div className="mt-9 flex items-end justify-between">
                <p className="eyebrow">2 · Down payment</p>
                <p className="text-sm text-white/70">
                  <span className="font-semibold text-white">{down}%</span> · <Price usd={plan.down} />
                </p>
              </div>
              <input
                type="range" min="0" max="50" step="5" value={down}
                onChange={(e) => setDown(Number(e.target.value))}
                aria-label="Down payment percentage"
                className="zrar-range mt-5"
                style={{ background: "linear-gradient(to right, #d9b36b 0%, #d9b36b " + pct + "%, rgba(255,255,255,.14) " + pct + "%, rgba(255,255,255,.14) 100%)" }}
              />
              <div className="mt-2 flex justify-between text-[10px] text-white/35"><span>0%</span><span>50%</span></div>

              <p className="eyebrow mt-9">3 · Plan length</p>
              <div className="mt-4 grid grid-cols-3 gap-3">
                {CONFIG.installmentMonths.map((m) => {
                  const pl = calcPlan(p.price, down, m);
                  const active = m === months;
                  return (
                    <button
                      key={m}
                      onClick={() => setMonths(m)}
                      aria-pressed={active}
                      className={"rounded-2xl border px-2 py-4 text-center transition " + (active ? "border-gold/60 bg-gold/10" : "border-white/10 bg-white/[0.03] hover:border-white/25")}
                    >
                      <span className="block font-display text-4xl font-medium leading-none">{m}</span>
                      <span className="mt-1 block text-[10px] uppercase tracking-[0.2em] text-white/45">months</span>
                      <span className="mt-3 block text-[11px] text-gold-light/90"><Price usd={pl.monthly} />/mo</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Result */}
            <div className="glass relative flex flex-col overflow-hidden rounded-[28px] p-6 sm:p-9">
              <p className="eyebrow">Your monthly payment</p>
              <h3 className="mt-3 font-display text-2xl text-white/80">{p.name}</h3>
              <div className="mt-6 flex flex-wrap items-baseline gap-x-3">
                <Price usd={plan.monthly} className="font-display font-semibold leading-none text-gold-grad" />
                <span className="text-sm text-white/50">/ month × {months}</span>
              </div>

              <dl className="mt-8 space-y-3.5 border-t border-white/10 pt-6 text-sm">
                <div className="flex justify-between gap-4"><dt className="text-white/55">Device price</dt><dd><Price usd={p.price} /></dd></div>
                <div className="flex justify-between gap-4"><dt className="text-white/55">Down payment ({down}%)</dt><dd><Price usd={plan.down} /></dd></div>
                <div className="flex justify-between gap-4"><dt className="text-white/55">Amount financed</dt><dd><Price usd={plan.financed} /></dd></div>
                {plan.feeAmount > 0 && (
                  <div className="flex justify-between gap-4"><dt className="text-white/55">Service fee</dt><dd><Price usd={plan.feeAmount} /></dd></div>
                )}
                <div className="flex justify-between gap-4 border-t border-white/10 pt-3.5 text-base font-semibold"><dt>Total payable</dt><dd><Price usd={plan.total} /></dd></div>
              </dl>

              <div className="mt-auto grid gap-3 pt-8">
                <a href={waLink(message)} target="_blank" rel="noopener noreferrer" className="btn btn-wa">
                  <WhatsAppIcon size={18} /> Request this plan on WhatsApp
                </a>
                <button onClick={() => onAdd(p)} className="btn btn-ghost">
                  <Icon name="bag" size={17} /> Add device to bag
                </button>
                <p className="text-center text-[11px] leading-relaxed text-white/40">
                  Indicative estimate. Final terms are confirmed with our team on WhatsApp.
                </p>
              </div>

              <BorderBeam size={300} duration={10} borderWidth={1.5} radius={28} colorFrom="#f3dba5" colorTo="#d9b36b" />
              <BorderBeam size={300} duration={10} delay={5} borderWidth={1.5} radius={28} colorFrom="#8b7bff" colorTo="#4cc9ff" />
            </div>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

/* ==========================================================================
   Shopping bag drawer + WhatsApp checkout
   ========================================================================== */
function CartDrawer({ open, onClose, items, totalUSD, setQty, remove, clear }) {
  const { cur, fmt } = useCurrency();
  const panel = useRef(null);
  const closeBtn = useRef(null);
  const [name, setName] = useState("");
  const [area, setArea] = useState("");
  const [notes, setNotes] = useState("");

  useEffect(() => {
    document.body.style.overflow = open ? "hidden" : "";
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    if (open) setTimeout(() => closeBtn.current && closeBtn.current.focus(), 350);
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [open]);

  useEffect(() => {
    if (!open || prefersReduced) return;
    const ctx = gsap.context(() => {
      gsap.fromTo(".cart-anim", { x: 36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, stagger: 0.06, delay: 0.2, ease: "power3.out" });
    }, panel);
    return () => ctx.revert();
  }, [open]);

  const message = useMemo(() => {
    const lines = items.map(
      (it, i) => (i + 1) + ". " + it.name + " × " + it.qty + " (" + fmt(it.price) + " each) = " + fmt(round2(it.price * it.qty))
    );
    return [
      "Hello ZRAR! I'd like to place an order:",
      "",
      ...lines,
      "",
      "Currency: " + (cur === "IQD" ? "IQD (1 USD = " + CONFIG.iqdPerUsd.toLocaleString("en-US") + " IQD)" : "USD"),
      "Total: " + fmt(totalUSD),
      ...(name.trim() ? ["", "Name: " + name.trim()] : []),
      ...(area.trim() ? ["Delivery area: " + area.trim()] : []),
      ...(notes.trim() ? ["Notes: " + notes.trim()] : []),
      "",
      "Please confirm availability and delivery. Thank you!",
    ].join("\n");
  }, [items, cur, fmt, totalUSD, name, area, notes]);

  const empty = items.length === 0;

  return (
    <div
      className="fixed inset-0 z-[70]"
      aria-hidden={!open}
      style={{ visibility: open ? "visible" : "hidden", transition: open ? "visibility 0s" : "visibility 0s linear .65s" }}
    >
      <div
        onClick={onClose}
        className={"absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity duration-500 " + (open ? "opacity-100" : "opacity-0")}
      />
      <aside
        ref={panel}
        role="dialog"
        aria-modal="true"
        aria-label="Shopping bag"
        className={"drawer-panel absolute right-0 top-0 flex h-full w-full max-w-[450px] flex-col transition-transform duration-[650ms] ease-[cubic-bezier(.22,1,.36,1)] " + (open ? "translate-x-0" : "translate-x-full")}
      >
        <div className="flex items-center justify-between border-b border-white/10 px-6 py-5">
          <div>
            <p className="eyebrow">Your selection</p>
            <h2 className="mt-1 font-display text-3xl font-medium">Shopping Bag</h2>
          </div>
          <button ref={closeBtn} onClick={onClose} aria-label="Close shopping bag" className="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 text-white/80 transition hover:border-gold/60 hover:text-white">
            <Icon name="close" size={18} />
          </button>
        </div>

        {empty ? (
          <div className="flex flex-1 flex-col items-center justify-center px-8 text-center">
            <div className="flex h-20 w-20 items-center justify-center rounded-full border border-white/10 bg-white/[0.04] text-gold">
              <Icon name="bag" size={32} strokeWidth={1.3} />
            </div>
            <h3 className="mt-6 font-display text-3xl">Your bag is empty</h3>
            <p className="mt-2 text-sm text-white/50">Add a flagship device or accessory and it will appear here.</p>
            <a href="#collection" onClick={onClose} className="btn btn-gold mt-8">Explore the Collection</a>
          </div>
        ) : (
          <>
            <ul className="flex-1 space-y-4 overflow-y-auto px-6 py-5">
              {items.map((it) => (
                <li key={it.id} className="cart-anim flex gap-4 rounded-2xl border border-white/10 bg-white/[0.03] p-3">
                  <ProductImage p={it} className="h-[84px] w-[84px] shrink-0 rounded-xl" />
                  <div className="flex min-w-0 flex-1 flex-col">
                    <div className="flex items-start justify-between gap-2">
                      <h4 className="font-display text-xl leading-tight">{it.name}</h4>
                      <button onClick={() => remove(it.id)} aria-label={"Remove " + it.name} className="shrink-0 text-white/40 transition hover:text-red-400">
                        <Icon name="trash" size={16} />
                      </button>
                    </div>
                    <div className="mt-0.5 text-xs text-white/45"><Price usd={it.price} /> each</div>
                    <div className="mt-auto flex items-center justify-between pt-2">
                      <div className="flex items-center rounded-full border border-white/12 bg-black/30">
                        <button onClick={() => setQty(it.id, it.qty - 1)} aria-label="Decrease quantity" className="flex h-8 w-8 items-center justify-center text-white/70 transition hover:text-white"><Icon name="minus" size={14} /></button>
                        <span className="w-7 text-center text-sm font-semibold" aria-live="polite">{it.qty}</span>
                        <button onClick={() => setQty(it.id, it.qty + 1)} aria-label="Increase quantity" className="flex h-8 w-8 items-center justify-center text-white/70 transition hover:text-white"><Icon name="plus" size={14} /></button>
                      </div>
                      <Price usd={round2(it.price * it.qty)} className="text-sm font-semibold" />
                    </div>
                  </div>
                </li>
              ))}
            </ul>

            <div className="cart-anim space-y-4 border-t border-white/10 bg-black/30 px-6 pb-6 pt-5">
              <div className="grid grid-cols-2 gap-2.5">
                <input className="field" placeholder="Your name (optional)" value={name} onChange={(e) => setName(e.target.value)} aria-label="Your name" />
                <input className="field" placeholder="Delivery area (optional)" value={area} onChange={(e) => setArea(e.target.value)} aria-label="Delivery area" />
                <input className="field col-span-2" placeholder="Notes — colour, storage, case model…" value={notes} onChange={(e) => setNotes(e.target.value)} aria-label="Order notes" />
              </div>

              <div>
                <div className="flex items-end justify-between">
                  <span className="text-sm uppercase tracking-[0.18em] text-white/55">Total</span>
                  <Price usd={totalUSD} className="font-display text-4xl font-semibold text-gold-grad" />
                </div>
                <p className="mt-1 text-right text-[11px] text-white/35">
                  Rate: 1 USD = {CONFIG.iqdPerUsd.toLocaleString("en-US")} IQD · Showing {cur}
                </p>
              </div>

              <a href={waLink(message)} target="_blank" rel="noopener noreferrer" className="btn btn-wa w-full">
                <WhatsAppIcon size={19} /> Order via WhatsApp
              </a>
              <button onClick={clear} className="w-full text-center text-xs text-white/40 transition hover:text-white/70">Clear bag</button>
            </div>
          </>
        )}
      </aside>
    </div>
  );
}

/* ==========================================================================
   Concierge CTA + footer + toast
   ========================================================================== */
function Concierge() {
  return (
    <section id="contact" className="relative py-24 sm:py-32">
      <div className="mx-auto max-w-5xl px-5 sm:px-8">
        <Reveal y={80} scale={0.93}>
          <div className="glass relative overflow-hidden rounded-[36px] px-6 py-14 text-center sm:px-16 sm:py-20">
            <p className="eyebrow">Concierge</p>
            <h2 className="mx-auto mt-4 max-w-2xl font-display text-4xl font-medium leading-[1.05] sm:text-6xl">
              Prefer to talk? <span className="italic text-gold-grad">We're a message away.</span>
            </h2>
            <p className="mx-auto mt-5 max-w-xl text-white/60">
              Tell us what you're looking for and our Erbil team will confirm availability, colours and delivery in minutes.
            </p>
            <a href={waLink("Hello ZRAR! I'd like some help choosing a device.")} target="_blank" rel="noopener noreferrer" className="btn btn-wa mt-9">
              <WhatsAppIcon size={19} /> Chat on WhatsApp
            </a>
            <p className="mt-4 text-sm tracking-wide text-white/45">{CONFIG.whatsappDisplay}</p>
            <BorderBeam size={420} duration={11} borderWidth={2} radius={36} colorFrom="#f3dba5" colorTo="#d9b36b" />
            <BorderBeam size={420} duration={11} delay={5.5} borderWidth={2} radius={36} colorFrom="#8b7bff" colorTo="#4cc9ff" />
          </div>
        </Reveal>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="relative border-t border-white/10 bg-black/50 backdrop-blur-xl">
      <div className="mx-auto flex max-w-7xl flex-col items-center justify-between gap-6 px-5 py-10 text-center sm:px-8 md:flex-row md:text-left">
        <div>
          <div className="font-display text-3xl font-semibold tracking-[0.32em] text-gold-grad">{CONFIG.brand}</div>
          <div className="mt-1 text-[10px] tracking-[0.28em] text-white/45">{CONFIG.subtitle}</div>
        </div>
        <nav className="flex flex-wrap justify-center gap-x-8 gap-y-2 text-sm text-white/55">
          <a href="#collection" className="hover:text-white">Collection</a>
          <a href="#hardware" className="hover:text-white">Hardware</a>
          <a href="#installments" className="hover:text-white">Installments</a>
          <a href={waLink()} target="_blank" rel="noopener noreferrer" className="hover:text-white">WhatsApp</a>
        </nav>
        <p className="max-w-xs text-[11px] leading-relaxed text-white/35">
          © {new Date().getFullYear()} ZRAR · Erbil, Kurdistan Region. Product names and trademarks belong to their respective owners.
        </p>
      </div>
    </footer>
  );
}

function Toast({ toast, onView }) {
  if (!toast) return null;
  return (
    <div
      key={toast.id}
      role="status"
      className="toast-pop glass fixed bottom-6 left-1/2 z-[90] flex max-w-[92vw] items-center gap-4 rounded-full py-2.5 pl-5 pr-2.5 text-sm shadow-[0_20px_60px_-20px_#000]"
      style={{ background: "rgba(14,14,14,.85)" }}
    >
      <span className="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-gold/20 text-gold"><Icon name="check" size={14} strokeWidth={2.4} /></span>
      <span className="truncate text-white/85">{toast.msg}</span>
      <button onClick={onView} className="shrink-0 rounded-full bg-gradient-to-b from-[#f3dba5] to-[#c9a15a] px-4 py-2 text-xs font-bold text-[#1a1305]">View bag</button>
    </div>
  );
}

/* ==========================================================================
   App
   ========================================================================== */
function App() {
  const [cart, setCart] = useState(loadCart);
  const [open, setOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [planId, setPlanId] = useState("iphone-16-pro-max");
  const bagRef = useRef(null);
  const firstCount = useRef(true);

  const items = useMemo(
    () => cart.map((c) => ({ ...PRODUCTS.find((p) => p.id === c.id), qty: c.qty })),
    [cart]
  );
  const count = items.reduce((n, i) => n + i.qty, 0);
  const totalUSD = round2(items.reduce((s, i) => s + i.price * i.qty, 0));

  useEffect(() => {
    try { localStorage.setItem("zrar_cart", JSON.stringify(cart)); } catch (e) {}
  }, [cart]);

  useEffect(() => {
    if (firstCount.current) { firstCount.current = false; return; }
    if (prefersReduced || !bagRef.current) return;
    gsap.fromTo(bagRef.current, { scale: 1 }, { scale: 1.2, yoyo: true, repeat: 1, duration: 0.18, ease: "power2.out" });
  }, [count]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3000);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    const refresh = () => ScrollTrigger.refresh();
    window.addEventListener("load", refresh);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
    return () => window.removeEventListener("load", refresh);
  }, []);

  const add = useCallback((p) => {
    setCart((prev) => {
      const ex = prev.find((c) => c.id === p.id);
      return ex
        ? prev.map((c) => (c.id === p.id ? { ...c, qty: Math.min(99, c.qty + 1) } : c))
        : [...prev, { id: p.id, qty: 1 }];
    });
    setToast({ id: Date.now(), msg: p.name + " added to your bag" });
  }, []);

  const setQty = useCallback((id, qty) => {
    setCart((prev) => (qty <= 0 ? prev.filter((c) => c.id !== id) : prev.map((c) => (c.id === id ? { ...c, qty: Math.min(99, qty) } : c))));
  }, []);
  const remove = useCallback((id) => setCart((prev) => prev.filter((c) => c.id !== id)), []);
  const clear = useCallback(() => setCart([]), []);

  const onPlan = useCallback((p) => {
    setPlanId(p.id);
    const el = document.getElementById("installments");
    if (el) el.scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "start" });
  }, []);

  return (
    <CurrencyProvider>
      <BackgroundVideo />
      <div className="ambient" aria-hidden="true"><i /><i /></div>
      <div className="grain" aria-hidden="true" />

      <div className="relative z-10">
        <Navbar count={count} onBag={() => setOpen(true)} bagRef={bagRef} />
        <main>
          <Hero />
          <Marquee />
          <Hardware />
          <Collection onAdd={add} onPlan={onPlan} />
          <Installments selectedId={planId} setSelectedId={setPlanId} onAdd={add} />
          <Concierge />
        </main>
        <Footer />
      </div>

      <CartDrawer open={open} onClose={() => setOpen(false)} items={items} totalUSD={totalUSD} setQty={setQty} remove={remove} clear={clear} />
      <Toast toast={open ? null : toast} onView={() => { setToast(null); setOpen(true); }} />
    </CurrencyProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
